id: https://mendelian.co/schemas/rapid-cp-logic
name: rapid_cp_schema
version: "0.1.0"
description: >-
  Schema for the two files that make up a deployable RAPID computable
  phenotype (CP):

    1. The CP logic file  <disease-id>_<level>_v<major>.<minor>.yaml
       Data-model-independent. Says WHAT counts as evidence (features, coded in
       source vocabularies: ICD10CM, SNOMED, LOINC, RxNorm, ...) and HOW the
       evidence combines (Level 1 disjuncts, Level 2a rules, Level 2b score).
       Every disjunct / rule / score item carries a stable id (d1, r2, s3) that
       is reported back as the flag reason.

    2. The build file  <cp-id>_<datamodel>.b<build>.sql
       The generated SQL for one data model (e.g. OMOP 5.4), shared by every
       site on it, with a YAML comment header that conforms to CPBuild.
  
    3. Site files  sites/<site>_v<version>.yaml
       Everything about one site (schemas, vocabulary release, history
       concepts), applied at run time.

  This schema is deliberately separate from the curation-record schema.
  The curation record holds the full evidence base and review trail;
  the CP logic file is the executable subset selected from it.
  Diseases are identified by Mondo ids only.

license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml: https://w3id.org/linkml/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  # Placeholder under the v0.1.0 schema id, so the generators run. The real RAPID prefix/PURL is open (SPEC.md §5.3).
  rapidcp: https://mendelian.co/schemas/rapid-cp-logic/
default_prefix: rapidcp
default_range: string
imports:
  - linkml:types

enums:
  CPLevel:
    permissible_values:
      L1:  {description: "Safe Alone - union of Tier-1 (highly-specific) disjuncts."}
      L2A: {description: "Deterministic rules - Boolean gates."}
      L2B: {description: "Deterministic score - weighted points vs threshold."}
      L3:  {description: "Profile match - declared here, not generated by cpsql."}

  SearchMode:
    permissible_values:
      population: {description: "Search the whole dataset for the target disease."}
      cluster:    {description: "Search only persons carrying an umbrella code (see cluster)."}

  FlagRateBasis:
    permissible_values:
      measured: {description: "From measured prevalence data."}
      class_band: {description: "From Orphanet's prevalence class only (no point figure)."}
      none: {description: "No usable epidemiology - a normal outcome for many rare diseases."}

  ReviewDecision:
    permissible_values:
      proceed: {description: "Criteria are sound; the CP can go to sites."}
      revise: {description: "Send back for revision."}

  CPStatus:
    permissible_values:
      draft: {description: "Being written; not yet tested at any site."}
      testing: {description: "Being tested at one or more sites."}
      accepted: {description: "Accepted at all seed sites."}
      refining: {description: "Accepted, but showed an underperformance signature and is being revised."}
      exemplar-candidate:
        description: >-
          Complex logic required; held for a future trained
          model. cpsql refuses to build SQL for it.
      deprecated: {description: "Superseded or withdrawn; kept for the record."}

  Module:
    description: >-
      The evidence domain a feature belongs to. Drives which OMOP tables are
      searched and which vocabularies are allowed (see docs/CP_YAML_SPEC.md §3.2).
    permissible_values:
      diagnostic_code: {description: "ICD10CM or SNOMED diagnosis; presence ever."}
      genetic_finding: {description: "Reported pathogenic / likely pathogenic variant in a causal gene."}
      diagnostic_test: {description: "Confirmatory test or biomarker RESULT (not the order)."}
      medication: {description: "Disease-specific drug, used as evidence of the diagnosis."}
      procedure: {description: "Diagnostic procedure, or disease-specific therapeutic procedure."}
      phenotype: {description: "Clinical/phenotypic feature: SNOMED, ICD10CM, or LOINC with a result."}

  CodeSystem:
    description: CP-side vocabulary names; cpsql maps each to its Athena vocabulary_id.
    permissible_values:
      ICD10CM: {description: "Athena vocabulary_id 'ICD10CM'. Dotted codes (E83.31)."}
      SNOMED: {description: "Athena 'SNOMED'."}
      LOINC: {description: "Athena 'LOINC' (includes LA answer codes)."}
      RXNORM: {description: "Athena 'RxNorm'."}
      UCUM: {description: "Athena 'UCUM'. Result units only."}

  ResultKind:
    permissible_values:
      numeric: {description: "value_as_number compared to a threshold."}
      qualitative: {description: "value_as_concept_id in a set of answer concepts."}

  ResultOperator:
    permissible_values:
      gt: {description: "x > value"}
      gte: {description: "x >= value"}
      lt: {description: "x < value"}
      lte: {description: "x <= value"}
      between: {description: "value <= x <= value_high"}
      above_ref_high: {description: "x > range_high recorded on the row (MEASUREMENT only)."}
      below_ref_low: {description: "x < range_low recorded on the row (MEASUREMENT only)."}

  DataModel:
    permissible_values:
      omop54: {description: "OMOP CDM v5.4"}
      truveta: {description: "Truveta native model (not generated by cpsql yet)."}

  SqlDialect:
    permissible_values:
      postgresql: {description: "PostgreSQL (default). The tests check the generated SQL parses as PostgreSQL."}
      duckdb: {description: "DuckDB. The generated SQL runs on it; the synthetic test database uses it."}

classes:

  # ------------------------------------------------------------------
  # CP logic file
  # ------------------------------------------------------------------
  ComputablePhenotype:
    tree_root: true
    description: One versioned CP. File name must equal cp_id + ".yaml".
    attributes:
      cp_id:
        identifier: true
        required: true
        pattern: "^mondo[0-9]{7}-[a-z0-9]+(-[a-z0-9]+)*_(L1|L2A|L2B|L3)_v[0-9]+\\.[0-9]+$"
        description: "<disease-id>_<level>_v<major>.<minor>, disease-id = lowercase Mondo id + '-' + disease.slug, e.g. mondo0010619-xlh_L1_v1.0"
      schema_version: {required: true, description: "Version of THIS schema the file conforms to, e.g. 0.1.0"}
      title: {required: true}
      disease: {range: DiseaseRef, required: true, inlined: true}
      level: {range: CPLevel, required: true}
      search_mode: {range: SearchMode, required: true}
      cluster: {range: ClusterScope, inlined: true, description: "Required iff search_mode = cluster."}
      status: {range: CPStatus, required: true}
      provenance: {range: CPProvenance, required: true, inlined: true}
      review: {range: ClinicalReview, inlined: true, description: "Clinical sign-off. Recorded only; not enforced."}
      sites_tested:
        range: SiteTest
        multivalued: true
        inlined_as_list: true
        description: Where this CP version has been run, and with which build. Recorded only.
      expected_flag_rate: {range: ExpectedFlagRate, inlined: true}
      features:
        range: Feature
        multivalued: true
        inlined_as_list: true
        required: true
        description: Atomic evidence items. Logic blocks reference them by id.
      disjuncts: {range: Disjunct, multivalued: true, inlined_as_list: true, description: "Level 1 only."}
      rules: {range: Rule, multivalued: true, inlined_as_list: true, description: "Level 2a only. CP fires if ANY rule fires."}
      score: {range: ScoreModel, inlined: true, description: "Level 2b only."}
      absorbed_into:
        pattern: "^cluster-[a-z0-9]+_(L1|L2A|L2B|L3)_v[0-9]+\\.[0-9]+$"
        description: >-
          The cluster CP that currently handles this disease, e.g.
          cluster-icd10n18x_L2A_v1.0. Empty once the disease stands alone.
          Cluster CPs themselves are not supported yet; the field and the
          cluster- naming are reserved so nothing needs renaming later.
      notes: {}

  DiseaseRef:
    attributes:
      mondo_id: {range: uriorcurie, required: true, pattern: "^MONDO:[0-9]{7}$"}
      slug:
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Short lowercase hyphenated disease name used in file names, e.g. xlh, fabry."
      name: {required: true, description: "Human-readable disease name, for reviewers. Not queried."}
      included_mondo_ids:
        range: uriorcurie
        multivalued: true
        pattern: "^MONDO:[0-9]{7}$"
        description: >-
          Every Mondo id that constitutes this disease entity, mondo_id included.
          One flat list on every CP, so the dashboard can find a disease's CPs
          with a single filter. Defaults to [mondo_id]. Recorded, not queried.
      curation_record_version:
        description: >-
          Version of the curation record (keyed by mondo_id) this CP was built
          from. Recorded, not queried.

  ClusterScope:
    description: >-
      Cluster-filtered search. The universe is persons with any of these
      umbrella codes (searched like a diagnostic_code feature); every
      criterion is then restricted to that universe.
    attributes:
      umbrella_codes: {range: CodeRef, multivalued: true, inlined_as_list: true, required: true}
      candidate_mondo_ids: {range: uriorcurie, multivalued: true, description: "Documentation only: the diseases under the umbrella. Not queried; each candidate gets its own CP."}

  CPProvenance:
    attributes:
      authored_by: {required: true}
      authored_date: {range: date, required: true}
      kg_extracted_at: {range: datetime, description: "When the MendelGraph subgraph the features were drawn from was extracted (ISO 8601, e.g. 2026-09-24T14:05:00Z)."}
      change_note: {description: "Why this version exists (PR description summary)."}
      supersedes: {description: "Previous cp_id, if any."}

  HistoryConcept:
    description: >-
      Either a SNOMED CT code (vocabulary + code), looked up at the site with its
      descendants unless include_descendants is false, or a raw OMOP concept_id used
      as is, e.g. a site-local concept.
    attributes:
      vocabulary: {description: "SNOMED (the only vocabulary allowed here)."}
      code: {}
      concept_id: {range: integer}
      label: {}
      include_descendants: {range: boolean, description: "Codes only. Default true."}

  SiteTest:
    attributes:
      site: {required: true, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: "Lowercase site name, e.g. unc, truveta, dartnet."}
      site_version: {range: integer, required: true, minimum_value: 1, description: "Version of the site file the run used."}
      build: {required: true, description: "build_id of the build that ran there; must be a build of this CP."}

  ClinicalReview:
    description: Expert sign-off on the disease and its criteria, before the CP is tested at a site.
    attributes:
      reviewer: {required: true}
      date: {range: date, required: true}
      decision: {range: ReviewDecision, required: true}
      comments: {}

  ExpectedFlagRate:
    description: >-
      Range of patients per 100,000 a correct CP should flag at a site
      (prevalence x ascertainment), from the Expected Flag Rate Pipeline. A wide
      range, not a target; feeds the flag-rate gauge.
    attributes:
      low_per_100k: {range: float, minimum_value: 0, description: "May be omitted for an open-ended range."}
      high_per_100k: {range: float, minimum_value: 0, description: "Required unless basis is none."}
      basis: {range: FlagRateBasis, required: true}
      source: {required: true, description: "Which pipeline run or reference produced the range."}

  Feature:
    attributes:
      id: {identifier: true, required: true, pattern: "^f[0-9]+$"}
      module: {range: Module, required: true}
      name: {required: true}
      specificity_tier:
        range: integer
        minimum_value: 1
        maximum_value: 5
        required: true
        description: "Specificity tier (1 = confirmatory/pathognomonic ... 5 = incidental). L1 disjuncts may only use tier 1."
      hpo_id: {range: uriorcurie, description: "Phenotype features: the HPO term this realises (annotation only, not queried)."}
      codes: {range: CodeRef, multivalued: true, inlined_as_list: true, required: true}
      result: {range: ResultCriterion, inlined: true, description: "Required for diagnostic_test and for LOINC-coded phenotype."}
      genetic: {range: GeneticCriterion, inlined: true, description: "Required for genetic_finding."}
      include_personal_history:
        range: boolean
        description: >-
          diagnostic_code and coded phenotype features only. Default true: also
          count OBSERVATION rows recording the patient's own history of the
          condition. Set false to count only direct records.
      text_terms:
        multivalued: true
        description: >-
          Names and synonyms for what the feature describes (a disease, a finding, a test
          or a drug), for a future text-search (NLP) step. Carried, never used by the OMOP generator.

  CodeRef:
    attributes:
      vocabulary: {range: CodeSystem, required: true}
      code: {required: true}
      label: {}
      include_descendants:
        range: boolean
        description: >-
          Default true for a feature's main codes, false for result value and unit
          codes. SNOMED/LOINC/RxNorm expand via CONCEPT_ANCESTOR; ICD10CM expands
          by code prefix.

  ResultCriterion:
    attributes:
      kind: {range: ResultKind, required: true}
      operator: {range: ResultOperator, description: "numeric only"}
      value: {range: float}
      value_high: {range: float, description: "between only"}
      units: {range: CodeRef, multivalued: true, inlined_as_list: true, description: "UCUM units the threshold applies to. Strongly recommended for numeric."}
      value_concepts: {range: CodeRef, multivalued: true, inlined_as_list: true, description: "qualitative only: accepted answers (e.g. LOINC LA6576-8 Positive)."}

  GeneticCriterion:
    description: >-
      A row qualifies if its concept is in the feature's codes AND (when given)
      its value_as_concept_id is an accepted interpretation AND (when
      require_gene_text_match) the gene symbol appears in the row's source text.
    attributes:
      gene_symbol: {required: true}
      hgnc_id: {pattern: "^HGNC:[0-9]+$"}
      interpretations: {range: CodeRef, multivalued: true, inlined_as_list: true}
      require_gene_text_match: {range: boolean, description: "Default true when codes are generic LOINC panels."}

  Disjunct:
    attributes:
      id: {identifier: true, required: true, pattern: "^d[0-9]+$"}
      feature: {required: true}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}
      label: {}

  Rule:
    attributes:
      id: {identifier: true, required: true, pattern: "^r[0-9]+$"}
      label: {}
      expr: {range: Expr, required: true, inlined: true}

  Expr:
    description: >-
      Exactly one of: feature | all_of | any_of | none_of | at_least+of | within.
      none_of = NOT(any of). A rule must contain at least one positive feature.
      min_distinct_dates / min_span_days apply to a feature leaf.
    attributes:
      feature: {}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}
      all_of: {range: Expr, multivalued: true, inlined_as_list: true}
      any_of: {range: Expr, multivalued: true, inlined_as_list: true}
      none_of: {range: Expr, multivalued: true, inlined_as_list: true}
      at_least: {range: integer, minimum_value: 1}
      of: {range: Expr, multivalued: true, inlined_as_list: true}
      within: {range: Within, inlined: true}

  Within:
    description: >-
      A record of each listed feature, all falling within `days` of each other.
      With in_order, the records must also occur in the listed order (the same day
      counts as in order).
    attributes:
      days: {range: integer, required: true, minimum_value: 0}
      in_order: {range: boolean}
      of: {multivalued: true, required: true, description: "Feature ids, at least two."}

  ScoreModel:
    attributes:
      threshold: {range: float, required: true}
      items: {range: ScoreItem, multivalued: true, inlined_as_list: true, required: true}

  ScoreItem:
    attributes:
      id: {identifier: true, required: true, pattern: "^s[0-9]+$"}
      feature: {required: true}
      points: {range: float, required: true, description: "May be negative."}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}

  # ------------------------------------------------------------------
  # Build file
  # ------------------------------------------------------------------
  CPBuild:
    description: >-
      Header of a build SQL file (<build_id>.sql): the YAML between "-- cpsql-build"
      and "-- end-cpsql-build", with the "-- " prefixes removed. Only CP-dependent
      fields; site settings are in site files.
    attributes:
      generator: {description: "cpsql version that wrote the SQL, e.g. 'cpsql 0.1.0'."}
      cp_logic_sha256:
        description: >-
          sha256 of the CP's logic (disease ids, level, search_mode, cluster, features,
          disjuncts, rules, score) the SQL was generated from. Lifecycle and
          documentation fields are excluded, so editing them doesn't invalidate a build.
      build_id:
        identifier: true
        required: true
        pattern: "^.+_v[0-9]+\\.[0-9]+_[a-z0-9]+\\.b[0-9]+$"
        description: "<cp_id>_<datamodel>.b<build>, e.g. mondo0010619-xlh_L1_v1.0_omop54.b1"
      cp_id: {required: true}
      datamodel: {range: DataModel, required: true}
      build: {range: integer, required: true, minimum_value: 1}
      change_note: {}

  SiteProfile:
    description: >-
      Site file, sites/<site>_v<version>.yaml: everything about running builds at
      one site. Applied at run time by `cpsql render --site`, so one build serves
      every site on a data model. Any change is a new version (new file); old
      versions are kept so past runs can be reproduced.
    attributes:
      site: {required: true, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: "Lowercase site name, e.g. unc."}
      version: {range: integer, required: true, minimum_value: 1}
      datamodel: {range: DataModel, required: true}
      cdm_version: {}
      dialect: {range: SqlDialect}
      vocabulary_version: {required: true, description: "The site's Athena release, from its VOCABULARY table."}
      cdm_schema: {required: true}
      vocab_schema: {required: true}
      source_value_fallback: {range: boolean, description: "Also match raw ICD-10-CM strings in *_source_value. Default true."}
      personal_history_concepts:
        range: HistoryConcept
        multivalued: true
        inlined_as_list: true
        description: >-
          Concepts that mark an OBSERVATION row as the patient's own history, with the
          condition in value_as_concept_id. Default: SNOMED CT 417662000 History of
          clinical finding in subject. Family-history concepts are deliberately not
          listed, so family history never matches.
      updated: {range: date, required: true}
      change_note: {}
