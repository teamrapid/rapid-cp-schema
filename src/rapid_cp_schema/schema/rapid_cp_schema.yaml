id: https://mendelian.co/schemas/rapid-cp-logic
name: rapid_cp_schema
version: "0.2.0"
description: >-
  Schema for RAPID computable phenotype (CP) logic files, named
  `<cp_name>.yaml`, e.g. `RAPID000123-xlh_L1_v1.0.yaml`.
  Data-model-independent. Says WHAT counts as evidence (features, coded in
  source vocabularies: ICD10CM, SNOMED, LOINC, RxNorm, ...) and HOW the
  evidence combines (Level 1 disjuncts, Level 2a rules, Level 2b score).
  Every disjunct / rule / score item carries a stable id (`d1`, `r2`, `s3`) that
  is reported back as the flag reason.

license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml: https://w3id.org/linkml/
  MONDO: http://purl.obolibrary.org/obo/MONDO_
  HP: http://purl.obolibrary.org/obo/HP_
  # Placeholder under the v0.1.0 schema id, so the generators run. The real RAPID prefix/PURL is open (SPEC.md §5.3).
  rapidcp: https://mendelian.co/schemas/rapid-cp-logic/
default_prefix: rapidcp
default_range: string
imports:
  - linkml:types

enums:
  CPLevel:
    description: "How a CP's features combine into a flag. The level decides which logic block the CP carries: `disjuncts` (L1), `rules` (L2A) or `score` (L2B); L3 has none yet."
    permissible_values:
      L1:  {description: "Safe Alone - union of S1 (confirmatory) disjuncts."}
      L2A: {description: "Deterministic rules - Boolean gates."}
      L2B: {description: "Deterministic score - weighted points vs threshold."}
      L3:  {description: "Profile match - declared here, not in scope."}

  SearchMode:
    description: "Which patients a CP searches: the whole dataset, or only those with an umbrella code."
    permissible_values:
      population: {description: "Search the whole dataset for the target disease."}
      cluster:    {description: "Search only persons carrying an umbrella code (see `cluster`)."}

  FlagRateBasis:
    description: "Where the numbers in an expected flag rate come from."
    permissible_values:
      measured: {description: "From measured prevalence data."}
      class_band: {description: "From Orphanet's prevalence class only (no point figure)."}
      none: {description: "No usable epidemiology - a normal outcome for many rare diseases."}

  ReviewDecision:
    description: "The outcome of a clinical review of a CP."
    permissible_values:
      proceed: {description: "Criteria are sound; the CP can go to sites."}
      revise: {description: "Send back for revision."}

  SpecificityGrade:
    description: "How specific a feature is to the target disease. The grade decides what counts as safe alone in L1."
    permissible_values:
      S1: {description: "Confirmatory: specific enough to flag a patient on its own. A code shared with a few closely related conditions can still be S1 when the CP accepts that loss of precision. Only S1 features may be L1 disjuncts."}
      S2: {description: "Highly specific: only a small number of other conditions produce this feature."}
      S3: {description: "Suggestive: the feature narrows the differential diagnosis but doesn't settle it."}
      S4: {description: "Weak: the feature says almost nothing about the disease on its own."}
      S5: {description: "Incidental: the feature is common in the disease but is not evidence for it."}

  Module:
    description: >-
      The evidence domain a feature belongs to. Drives which OMOP tables are
      searched and which vocabularies are allowed.
    permissible_values:
      diagnostic_code: {description: "ICD10CM or SNOMED diagnosis; presence ever."}
      genetic_finding: {description: "Reported pathogenic / likely pathogenic variant in a causal gene."}
      diagnostic_test: {description: "Confirmatory test or biomarker RESULT (not the order)."}
      medication: {description: "Disease-specific drug, used as evidence of the diagnosis."}
      procedure: {description: "Diagnostic procedure, or disease-specific therapeutic procedure."}
      phenotype: {description: "Clinical/phenotypic feature: SNOMED, ICD10CM, or LOINC with a result."}

  CodeSystem:
    description: CP-side vocabulary names.
    permissible_values:
      ICD10CM: {description: "Athena `vocabulary_id` `ICD10CM`. Dotted codes (`E83.31`)."}
      SNOMED: {description: "Athena `SNOMED`."}
      LOINC: {description: "Athena `LOINC` (includes LA answer codes)."}
      RXNORM: {description: "Athena `RxNorm`."}
      UCUM: {description: "Athena `UCUM`. Result units only."}

  ResultKind:
    description: "Whether a result is compared with a threshold or matched against a set of accepted answers."
    permissible_values:
      numeric: {description: "`value_as_number` compared to a threshold."}
      qualitative: {description: "`value_as_concept_id` in a set of answer concepts."}

  ResultOperator:
    description: "How a `numeric` result is compared: with a fixed threshold, a fixed range, or the normal range recorded with the result."
    permissible_values:
      gt: {description: "`x > value`"}
      gte: {description: "`x >= value`"}
      lt: {description: "`x < value`"}
      lte: {description: "`x <= value`"}
      between: {description: "`value <= x <= value_high`"}
      above_ref_high: {description: "`x > range_high`, the upper limit recorded on the same row (`measurement` only)."}
      below_ref_low: {description: "`x < range_low`, the lower limit recorded on the same row (`measurement` only)."}

classes:

  ComputablePhenotype:
    tree_root: true
    description: "One versioned CP. File name must equal `cp_name` + `.yaml`."
    attributes:
      cp_name:
        identifier: true
        required: true
        pattern: "^RAPID[0-9]{6}-[a-z0-9]+(-[a-z0-9]+)*_(L1|L2A|L2B|L3)_v[0-9]+\\.[0-9]+$"
        description: >-
          Name of the CP version, built from the disease entity, level and version.
          Format: `<disease_entity_id>-<slug>_<level>_v<major>.<minor>`, where
          `<disease_entity_id>` is `disease.disease_entity_id` and `<slug>` is
          `disease.slug`, e.g. `RAPID000123-xlh_L1_v1.0`.
      schema_version: {required: true, description: "Version of THIS schema the file conforms to, e.g. `0.2.0`"}
      title: {required: true}
      disease: {range: DiseaseRef, required: true, inlined: true}
      level: {range: CPLevel, required: true}
      search_mode: {range: SearchMode, required: true}
      cluster: {range: ClusterScope, inlined: true, description: "Required if and only if `search_mode` is `cluster`."}
      provenance: {range: CPProvenance, required: true, inlined: true}
      review: {range: ClinicalReview, inlined: true, description: "Clinical sign-off. Recorded only; not enforced."}
      expected_flag_rate: {range: ExpectedFlagRate, inlined: true}
      features:
        range: Feature
        multivalued: true
        inlined_as_list: true
        required: true
        description: Atomic evidence items. Logic blocks reference them by id.
      disjuncts: {range: Disjunct, multivalued: true, inlined_as_list: true, description: "Level 1 only."}
      rules: {range: Rule, multivalued: true, inlined_as_list: true, description: "Level 2a only. CP fires if ANY rule fires."}
      score: {range: ScoreModel, inlined: true, description: "Level 2b only."}
      absorbed_into:
        pattern: "^cluster-[a-z0-9]+_(L1|L2A|L2B|L3)_v[0-9]+\\.[0-9]+$"
        description: >-
          The cluster CP that currently handles this disease, e.g.
          `cluster-icd10n18x_L2A_v1.0`. Empty once the disease stands alone.
          Cluster CPs themselves are not supported yet; the field and the
          `cluster-` naming are reserved so nothing needs renaming later.
      notes: {}

  DiseaseRef:
    description: "The disease entity a CP is for, identified by a RAPID disease entity id and an anchor Mondo id."
    attributes:
      disease_entity_id:
        required: true
        pattern: "^RAPID[0-9]{6}$"
        description: >-
          Opaque id of the disease entity, `RAPID` + exactly six digits, e.g.
          `RAPID000123`. Minted by Mendelian. Every CP for the entity carries
          the same id, across levels and versions. It does not depend on Mondo,
          so it stays the same when the anchor Mondo id is obsoleted or merged.
      mondo_id: {range: uriorcurie, required: true, pattern: "^MONDO:[0-9]{7}$"}
      slug:
        required: true
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        description: "Short lowercase hyphenated disease name used in file names, e.g. `xlh`, `fabry`."
      name: {required: true, description: "Human-readable disease name, for reviewers. Not queried."}
      included_mondo_ids:
        range: uriorcurie
        multivalued: true
        pattern: "^MONDO:[0-9]{7}$"
        description: >-
          Every Mondo id that constitutes this disease entity, `mondo_id` included.
          Defaults to `[mondo_id]`. Recorded, not queried.
      curation_record_version:
        description: >-
          Version of the curation record (keyed by `mondo_id`) this CP was built
          from. Recorded, not queried.



  ClusterScope:
    description: >-
      Limits the search to patients who have at least one of the umbrella codes.
      Every criterion is then evaluated only for those patients.
    attributes:
      umbrella_codes: {range: CodeRef, multivalued: true, inlined_as_list: true, required: true}
      candidate_mondo_ids: {range: uriorcurie, multivalued: true, description: "Documentation only: the diseases under the umbrella. Not queried; each candidate gets its own CP."}

  CPProvenance:
    description: "Who wrote this CP version and when."
    attributes:
      authored_by: {required: true}
      authored_date: {range: date, required: true}
      kg_extracted_at: {range: datetime, description: "When Mendelian extracted the source data behind the features (ISO 8601, e.g. `2026-09-24T14:05:00Z`)."}
      change_note: {description: "Why this version exists (PR description summary)."}
      supersedes: {description: "Previous `cp_name`, if any."}

  ClinicalReview:
    description: Expert sign-off on the disease and its criteria, before the CP is tested at a site.
    attributes:
      reviewer: {required: true}
      date: {range: date, required: true}
      decision: {range: ReviewDecision, required: true}
      comments: {}

  ExpectedFlagRate:
    description: >-
      Range of patients per 100,000 a correct CP should flag at a site.
    attributes:
      low_per_100k: {range: float, minimum_value: 0, description: "May be omitted for an open-ended range."}
      high_per_100k: {range: float, minimum_value: 0, description: "Required unless `basis` is `none`."}
      basis: {range: FlagRateBasis, required: true}
      source: {required: true, description: "Which pipeline run or reference produced the range."}

  Feature:
    description: "One piece of evidence: a set of codes for one module, plus the result or genetic finding that must be found where the module needs one. Logic blocks refer to features by id."
    attributes:
      id: {identifier: true, required: true, pattern: "^f[0-9]+$"}
      module: {range: Module, required: true}
      name: {required: true}
      specificity_grade:
        range: SpecificityGrade
        required: true
        description: "How specific the feature is to the target disease, from S1 (confirmatory) to S5 (incidental). L1 disjuncts may only use S1 features."
      hpo_id: {range: uriorcurie, description: "Phenotype features: the HPO term this realises (annotation only, not queried)."}
      codes: {range: CodeRef, multivalued: true, inlined_as_list: true, required: true}
      result: {range: ResultCriterion, inlined: true, description: "Required for `diagnostic_test` features and for LOINC-coded `phenotype` features."}
      genetic: {range: GeneticCriterion, inlined: true, description: "Required for `genetic_finding` features."}
      include_personal_history:
        range: boolean
        description: >-
          `diagnostic_code` and coded `phenotype` features only. Default `true`: also
          count `observation` rows recording the patient's own history of the
          condition. Set `false` to count only direct records.
      text_terms:
        multivalued: true
        description: >-
          Names and synonyms for what the feature describes (a disease, a finding, a test
          or a drug), for a future text-search (NLP) step.


  CodeRef:
    description: "A code written as it appears in its source vocabulary, never as an OMOP `concept_id`."
    attributes:
      vocabulary: {range: CodeSystem, required: true}
      code: {required: true}
      label: {}
      include_descendants:
        range: boolean
        description: >-
          Default `true` for a feature's main codes, `false` for result value and unit
          codes. SNOMED/LOINC/RxNorm expand via `CONCEPT_ANCESTOR`; ICD10CM expands
          by code prefix.


  ResultCriterion:
    description: "The result a test or measurement record must have to count: a numeric comparison or a set of accepted answers."
    attributes:
      kind: {range: ResultKind, required: true}
      operator: {range: ResultOperator, description: "`numeric` only"}
      value: {range: float}
      value_high: {range: float, description: "`between` only"}
      units: {range: CodeRef, multivalued: true, inlined_as_list: true, description: "UCUM units the threshold applies to. Strongly recommended for `numeric`."}
      value_concepts: {range: CodeRef, multivalued: true, inlined_as_list: true, description: "`qualitative` only: accepted answers (e.g. LOINC `LA6576-8` Positive)."}

  GeneticCriterion:
    description: >-
      The variant result a `genetic_finding` feature looks for: a causal gene and
      the interpretations that count, such as pathogenic or likely pathogenic.
      A record matches when it carries one of the feature's codes, its
      interpretation is one of those listed (if any are), and, when
      `require_gene_text_match` is `true`, the gene symbol appears in the record's text.
    attributes:
      gene_symbol: {required: true}
      hgnc_id: {pattern: "^HGNC:[0-9]+$"}
      interpretations: {range: CodeRef, multivalued: true, inlined_as_list: true}
      require_gene_text_match: {range: boolean, description: "Default `true` when codes are generic LOINC panels."}

  Disjunct:
    description: "A Level 1 criterion: one S1 feature that is enough on its own to flag a patient. Its id is reported with the counts."
    attributes:
      id: {identifier: true, required: true, pattern: "^d[0-9]+$"}
      feature: {required: true}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}
      label: {}

  Rule:
    description: "A Level 2A criterion: a Boolean condition over features. A patient is flagged if any rule holds; each rule's id is reported with the counts."
    attributes:
      id: {identifier: true, required: true, pattern: "^r[0-9]+$"}
      label: {}
      expr: {range: Expr, required: true, inlined: true}

  Expr:
    description: >-
      One condition in a Level 2A rule. Each node uses exactly one form: `feature`,
      `all_of`, `any_of`, `none_of` (none of the listed conditions holds),
      `at_least` with `of`, or `within`. A rule must contain at least one feature
      that isn't under `none_of`. `min_distinct_dates` and `min_span_days` apply
      only to a `feature` node.
    attributes:
      feature: {}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}
      all_of: {range: Expr, multivalued: true, inlined_as_list: true}
      any_of: {range: Expr, multivalued: true, inlined_as_list: true}
      none_of: {range: Expr, multivalued: true, inlined_as_list: true}
      at_least: {range: integer, minimum_value: 1}
      of: {range: Expr, multivalued: true, inlined_as_list: true}
      within: {range: Within, inlined: true}

  Within:
    description: >-
      A record of each listed feature, all falling within `days` of each other.
      With `in_order`, the records must also occur in the listed order (the same day
      counts as in order).
    attributes:
      days: {range: integer, required: true, minimum_value: 0}
      in_order: {range: boolean}
      of: {multivalued: true, required: true, description: "Feature ids, at least two."}

  ScoreModel:
    description: "The Level 2B logic: a patient is flagged when the points of the items that apply add up to the threshold."
    attributes:
      threshold: {range: float, required: true}
      items: {range: ScoreItem, multivalued: true, inlined_as_list: true, required: true}

  ScoreItem:
    description: "A Level 2B score item: points added when its feature is present. Its id is reported with the counts."
    attributes:
      id: {identifier: true, required: true, pattern: "^s[0-9]+$"}
      feature: {required: true}
      points: {range: float, required: true, description: "May be negative."}
      min_distinct_dates: {range: integer, minimum_value: 1}
      min_span_days: {range: integer, minimum_value: 1, description: "Records must stretch across at least this many days, first to last."}
