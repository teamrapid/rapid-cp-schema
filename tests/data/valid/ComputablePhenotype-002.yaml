# Level 2A CP for X-linked hypophosphatemia, using the rule examples from the v0.1.0 spec.
# Illustrative only: not a clinically reviewed CP.
cp_name: RAPID000123-xlh_L2A_v2.0
schema_version: 0.2.0
title: X-linked hypophosphatemia, Level 2A
disease:
  disease_entity_id: RAPID000123
  mondo_id: MONDO:0010619
  slug: xlh
  name: X-linked hypophosphatemia
level: L2A
search_mode: cluster
cluster:
  umbrella_codes:
    - {vocabulary: ICD10CM, code: E83.3, label: Disorders of phosphorus metabolism and phosphatases}
provenance:
  authored_by: example
  authored_date: "2026-10-27"
  supersedes: RAPID000123-xlh_L1_v1.0
features:
  - id: f2
    module: diagnostic_code
    name: XLH diagnosis code
    specificity_grade: 2
    codes:
      - {vocabulary: ICD10CM, code: E83.31}
  - id: f5
    module: medication
    name: burosumab
    specificity_grade: 1
    codes:
      - {vocabulary: RXNORM, code: "2043855", label: burosumab}
  - id: f6
    module: phenotype
    name: Low serum phosphate
    specificity_grade: 3
    codes:
      - {vocabulary: LOINC, code: 2777-1}
    result: {kind: numeric, operator: below_ref_low}
rules:
  - id: r1
    expr:
      all_of:
        - {feature: f2, min_distinct_dates: 2}
        - {feature: f6}
  - id: r2
    expr:
      within: {days: 365, in_order: true, of: [f2, f5]}
