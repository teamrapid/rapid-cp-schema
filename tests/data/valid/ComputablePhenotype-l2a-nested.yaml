# L2A CP using every Expr node kind, nested, including within inside none_of
# (spec §5.2: "the diagnosis, but not treated within a year").
cp_id: mondo0010619-xlh_L2A_v1.0
schema_version: 0.1.0
title: X-linked hypophosphatemia, Level 2A
disease: {mondo_id: 'MONDO:0010619', slug: xlh, name: X-linked hypophosphatemia}
level: L2A
search_mode: population
status: draft
provenance: {authored_by: example, authored_date: '2026-10-27'}
features:
- id: f1
  module: diagnostic_code
  name: XLH diagnosis code
  specificity_tier: 1
  codes:
  - {vocabulary: ICD10CM, code: E83.31, label: Familial hypophosphatemia}
- id: f2
  module: medication
  name: burosumab
  specificity_tier: 1
  codes:
  - {vocabulary: RXNORM, code: '2043855', label: burosumab}
- id: f4
  module: phenotype
  name: Low serum phosphate
  specificity_tier: 3
  hpo_id: HP:0002148
  codes:
  - {vocabulary: LOINC, code: 2777-1}
  result: {kind: numeric, operator: below_ref_low}
- id: f5
  module: phenotype
  name: Rickets
  specificity_tier: 3
  hpo_id: HP:0002748
  codes:
  - {vocabulary: SNOMED, code: '41345002', label: Rickets}
- id: f6
  module: diagnostic_test
  name: Raised FGF23
  specificity_tier: 2
  codes:
  - {vocabulary: LOINC, code: 53304-2}
  result:
    kind: numeric
    operator: gt
    value: 100
    units:
    - {vocabulary: UCUM, code: pg/mL}
rules:
- id: r1
  label: Code plus biochemistry
  expr:
    all_of:
    - {feature: f1, min_distinct_dates: 2, min_span_days: 30}
    - any_of:
      - {feature: f4}
      - {feature: f6}
    - none_of:
      - within:
          days: 365
          in_order: true
          of: [f1, f2]
- id: r2
  expr:
    at_least: 2
    of:
    - {feature: f4}
    - {feature: f5}
    - {feature: f6}
- id: r3
  expr:
    within:
      days: 365
      of: [f1, f2]
- id: r4
  expr: {feature: f2}
