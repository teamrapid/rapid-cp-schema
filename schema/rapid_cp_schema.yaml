name: rapid_cp_schema
description: "Schema for the two files that make up a deployable RAPID computable\
  \ phenotype (CP):\n\n  1. The CP logic file  <disease-id>_<level>_v<major>.<minor>.yaml\n\
  \     Data-model-independent. Says WHAT counts as evidence (features, coded in\n\
  \     source vocabularies: ICD10CM, SNOMED, LOINC, RxNorm, ...) and HOW the\n  \
  \   evidence combines (Level 1 disjuncts, Level 2a rules, Level 2b score).\n   \
  \  Every disjunct / rule / score item carries a stable id (d1, r2, s3) that\n  \
  \   is reported back as the flag reason.\n\n  2. The build file  <cp-id>_<datamodel>.b<build>.sql\n\
  \     The generated SQL for one data model (e.g. OMOP 5.4), shared by every\n  \
  \   site on it, with a YAML comment header that conforms to CPBuild.\n\n  3. Site\
  \ files  sites/<site>_v<version>.yaml\n     Everything about one site (schemas,\
  \ vocabulary release, history\n     concepts), applied at run time.\n\nThis schema\
  \ is deliberately separate from the curation-record schema. The curation record\
  \ holds the full evidence base and review trail; the CP logic file is the executable\
  \ subset selected from it. Diseases are identified by Mondo ids only."
id: https://mendelian.co/schemas/rapid-cp-logic
version: 0.1.0
imports:
- linkml:types
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  MONDO:
    prefix_prefix: MONDO
    prefix_reference: http://purl.obolibrary.org/obo/MONDO_
  HP:
    prefix_prefix: HP
    prefix_reference: http://purl.obolibrary.org/obo/HP_
  rapidcp:
    prefix_prefix: rapidcp
    prefix_reference: https://mendelian.co/schemas/rapid-cp-logic/
default_prefix: rapidcp
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  CPLevel:
    name: CPLevel
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CPLevel
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      L1:
        text: L1
        description: Safe Alone - union of Tier-1 (highly-specific) disjuncts.
      L2A:
        text: L2A
        description: Deterministic rules - Boolean gates.
      L2B:
        text: L2B
        description: Deterministic score - weighted points vs threshold.
      L3:
        text: L3
        description: Profile match - declared here, not generated by cpsql.
  SearchMode:
    name: SearchMode
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/SearchMode
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      population:
        text: population
        description: Search the whole dataset for the target disease.
      cluster:
        text: cluster
        description: Search only persons carrying an umbrella code (see cluster).
  FlagRateBasis:
    name: FlagRateBasis
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/FlagRateBasis
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      measured:
        text: measured
        description: From measured prevalence data.
      class_band:
        text: class_band
        description: From Orphanet's prevalence class only (no point figure).
      none:
        text: none
        description: No usable epidemiology - a normal outcome for many rare diseases.
  ReviewDecision:
    name: ReviewDecision
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ReviewDecision
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      proceed:
        text: proceed
        description: Criteria are sound; the CP can go to sites.
      revise:
        text: revise
        description: Send back for revision.
  CPStatus:
    name: CPStatus
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CPStatus
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      draft:
        text: draft
        description: Being written; not yet tested at any site.
      testing:
        text: testing
        description: Being tested at one or more sites.
      accepted:
        text: accepted
        description: Accepted at all seed sites.
      refining:
        text: refining
        description: Accepted, but showed an underperformance signature and is being
          revised.
      exemplar-candidate:
        text: exemplar-candidate
        description: Complex logic required; held for a future trained model. cpsql
          refuses to build SQL for it.
      deprecated:
        text: deprecated
        description: Superseded or withdrawn; kept for the record.
  Module:
    name: Module
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Module
    description: "The evidence domain a feature belongs to. Drives which OMOP tables\
      \ are searched and which vocabularies are allowed (see docs/CP_YAML_SPEC.md\
      \ \xA73.2)."
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      diagnostic_code:
        text: diagnostic_code
        description: ICD10CM or SNOMED diagnosis; presence ever.
      genetic_finding:
        text: genetic_finding
        description: Reported pathogenic / likely pathogenic variant in a causal gene.
      diagnostic_test:
        text: diagnostic_test
        description: Confirmatory test or biomarker RESULT (not the order).
      medication:
        text: medication
        description: Disease-specific drug, used as evidence of the diagnosis.
      procedure:
        text: procedure
        description: Diagnostic procedure, or disease-specific therapeutic procedure.
      phenotype:
        text: phenotype
        description: 'Clinical/phenotypic feature: SNOMED, ICD10CM, or LOINC with
          a result.'
  CodeSystem:
    name: CodeSystem
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CodeSystem
    description: CP-side vocabulary names; cpsql maps each to its Athena vocabulary_id.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      ICD10CM:
        text: ICD10CM
        description: Athena vocabulary_id 'ICD10CM'. Dotted codes (E83.31).
      SNOMED:
        text: SNOMED
        description: Athena 'SNOMED'.
      LOINC:
        text: LOINC
        description: Athena 'LOINC' (includes LA answer codes).
      RXNORM:
        text: RXNORM
        description: Athena 'RxNorm'.
      UCUM:
        text: UCUM
        description: Athena 'UCUM'. Result units only.
  ResultKind:
    name: ResultKind
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ResultKind
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      numeric:
        text: numeric
        description: value_as_number compared to a threshold.
      qualitative:
        text: qualitative
        description: value_as_concept_id in a set of answer concepts.
  ResultOperator:
    name: ResultOperator
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ResultOperator
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      gt:
        text: gt
        description: x > value
      gte:
        text: gte
        description: x >= value
      lt:
        text: lt
        description: x < value
      lte:
        text: lte
        description: x <= value
      between:
        text: between
        description: value <= x <= value_high
      above_ref_high:
        text: above_ref_high
        description: x > range_high recorded on the row (MEASUREMENT only).
      below_ref_low:
        text: below_ref_low
        description: x < range_low recorded on the row (MEASUREMENT only).
  DataModel:
    name: DataModel
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/DataModel
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      omop54:
        text: omop54
        description: OMOP CDM v5.4
      truveta:
        text: truveta
        description: Truveta native model (not generated by cpsql yet).
  SqlDialect:
    name: SqlDialect
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/SqlDialect
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    permissible_values:
      postgresql:
        text: postgresql
        description: PostgreSQL (default). The tests check the generated SQL parses
          as PostgreSQL.
      duckdb:
        text: duckdb
        description: DuckDB. The generated SQL runs on it; the synthetic test database
          uses it.
slots:
  computablePhenotype__cp_id:
    name: computablePhenotype__cp_id
    description: <disease-id>_<level>_v<major>.<minor>, disease-id = lowercase Mondo
      id + '-' + disease.slug, e.g. mondo0010619-xlh_L1_v1.0
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cp_id
    identifier: true
    alias: cp_id
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: string
    required: true
    pattern: ^mondo[0-9]{7}-[a-z0-9]+(-[a-z0-9]+)*_(L1|L2A|L2B|L3)_v[0-9]+\.[0-9]+$
  computablePhenotype__schema_version:
    name: computablePhenotype__schema_version
    description: Version of THIS schema the file conforms to, e.g. 0.1.0
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:schema_version
    alias: schema_version
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: string
    required: true
  computablePhenotype__title:
    name: computablePhenotype__title
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:title
    alias: title
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: string
    required: true
  computablePhenotype__disease:
    name: computablePhenotype__disease
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:disease
    alias: disease
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: DiseaseRef
    required: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__level:
    name: computablePhenotype__level
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:level
    alias: level
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: CPLevel
    required: true
  computablePhenotype__search_mode:
    name: computablePhenotype__search_mode
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:search_mode
    alias: search_mode
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: SearchMode
    required: true
  computablePhenotype__cluster:
    name: computablePhenotype__cluster
    description: Required iff search_mode = cluster.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cluster
    alias: cluster
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: ClusterScope
    inlined: true
    inlined_as_list: true
  computablePhenotype__status:
    name: computablePhenotype__status
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:status
    alias: status
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: CPStatus
    required: true
  computablePhenotype__provenance:
    name: computablePhenotype__provenance
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:provenance
    alias: provenance
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: CPProvenance
    required: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__review:
    name: computablePhenotype__review
    description: Clinical sign-off. Recorded only; not enforced.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:review
    alias: review
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: ClinicalReview
    inlined: true
    inlined_as_list: true
  computablePhenotype__sites_tested:
    name: computablePhenotype__sites_tested
    description: Where this CP version has been run, and with which build. Recorded
      only.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:sites_tested
    alias: sites_tested
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: SiteTest
    multivalued: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__expected_flag_rate:
    name: computablePhenotype__expected_flag_rate
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:expected_flag_rate
    alias: expected_flag_rate
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: ExpectedFlagRate
    inlined: true
    inlined_as_list: true
  computablePhenotype__features:
    name: computablePhenotype__features
    description: Atomic evidence items. Logic blocks reference them by id.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:features
    alias: features
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: Feature
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__disjuncts:
    name: computablePhenotype__disjuncts
    description: Level 1 only.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:disjuncts
    alias: disjuncts
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: Disjunct
    multivalued: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__rules:
    name: computablePhenotype__rules
    description: Level 2a only. CP fires if ANY rule fires.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:rules
    alias: rules
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: Rule
    multivalued: true
    inlined: true
    inlined_as_list: true
  computablePhenotype__score:
    name: computablePhenotype__score
    description: Level 2b only.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:score
    alias: score
    owner: ComputablePhenotype
    domain_of:
    - ComputablePhenotype
    range: ScoreModel
    inlined: true
    inlined_as_list: true
  computablePhenotype__absorbed_into:
    name: computablePhenotype__absorbed_into
    description: The cluster CP that currently handles this disease, e.g. cluster-icd10n18x_L2A_v1.0.
      Empty once the disease stands alone. Cluster CPs themselves are not supported
      yet; the field and the cluster- naming are reserved so nothing needs renaming
