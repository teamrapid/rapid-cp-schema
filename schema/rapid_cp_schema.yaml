    - Within
    range: boolean
  within__of:
    name: within__of
    description: Feature ids, at least two.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:of
    alias: of
    owner: Within
    domain_of:
    - Within
    range: string
    required: true
    multivalued: true
  scoreModel__threshold:
    name: scoreModel__threshold
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:threshold
    alias: threshold
    owner: ScoreModel
    domain_of:
    - ScoreModel
    range: float
    required: true
  scoreModel__items:
    name: scoreModel__items
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:items
    alias: items
    owner: ScoreModel
    domain_of:
    - ScoreModel
    range: ScoreItem
    required: true
    multivalued: true
    inlined: true
    inlined_as_list: true
  scoreItem__id:
    name: scoreItem__id
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:id
    identifier: true
    alias: id
    owner: ScoreItem
    domain_of:
    - ScoreItem
    range: string
    required: true
    pattern: ^s[0-9]+$
  scoreItem__feature:
    name: scoreItem__feature
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:feature
    alias: feature
    owner: ScoreItem
    domain_of:
    - ScoreItem
    range: string
    required: true
  scoreItem__points:
    name: scoreItem__points
    description: May be negative.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:points
    alias: points
    owner: ScoreItem
    domain_of:
    - ScoreItem
    range: float
    required: true
  scoreItem__min_distinct_dates:
    name: scoreItem__min_distinct_dates
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:min_distinct_dates
    alias: min_distinct_dates
    owner: ScoreItem
    domain_of:
    - ScoreItem
    range: integer
    minimum_value: 1
  scoreItem__min_span_days:
    name: scoreItem__min_span_days
    description: Records must stretch across at least this many days, first to last.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:min_span_days
    alias: min_span_days
    owner: ScoreItem
    domain_of:
    - ScoreItem
    range: integer
    minimum_value: 1
  cPBuild__generator:
    name: cPBuild__generator
    description: cpsql version that wrote the SQL, e.g. 'cpsql 0.1.0'.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:generator
    alias: generator
    owner: CPBuild
    domain_of:
    - CPBuild
    range: string
  cPBuild__cp_logic_sha256:
    name: cPBuild__cp_logic_sha256
    description: sha256 of the CP's logic (disease ids, level, search_mode, cluster,
      features, disjuncts, rules, score) the SQL was generated from. Lifecycle and
      documentation fields are excluded, so editing them doesn't invalidate a build.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cp_logic_sha256
    alias: cp_logic_sha256
    owner: CPBuild
    domain_of:
    - CPBuild
    range: string
  cPBuild__build_id:
    name: cPBuild__build_id
    description: <cp_id>_<datamodel>.b<build>, e.g. mondo0010619-xlh_L1_v1.0_omop54.b1
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:build_id
    identifier: true
    alias: build_id
    owner: CPBuild
    domain_of:
    - CPBuild
    range: string
    required: true
    pattern: ^.+_v[0-9]+\.[0-9]+_[a-z0-9]+\.b[0-9]+$
  cPBuild__cp_id:
    name: cPBuild__cp_id
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cp_id
    alias: cp_id
    owner: CPBuild
    domain_of:
    - CPBuild
    range: string
    required: true
  cPBuild__datamodel:
    name: cPBuild__datamodel
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:datamodel
    alias: datamodel
    owner: CPBuild
    domain_of:
    - CPBuild
    range: DataModel
    required: true
  cPBuild__build:
    name: cPBuild__build
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:build
    alias: build
    owner: CPBuild
    domain_of:
    - CPBuild
    range: integer
    required: true
    minimum_value: 1
  cPBuild__change_note:
    name: cPBuild__change_note
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:change_note
    alias: change_note
    owner: CPBuild
    domain_of:
    - CPBuild
    range: string
  siteProfile__site:
    name: siteProfile__site
    description: Lowercase site name, e.g. unc.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:site
    alias: site
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
    required: true
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
  siteProfile__version:
    name: siteProfile__version
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:version
    alias: version
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: integer
    required: true
    minimum_value: 1
  siteProfile__datamodel:
    name: siteProfile__datamodel
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:datamodel
    alias: datamodel
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: DataModel
    required: true
  siteProfile__cdm_version:
    name: siteProfile__cdm_version
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cdm_version
    alias: cdm_version
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
  siteProfile__dialect:
    name: siteProfile__dialect
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:dialect
    alias: dialect
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: SqlDialect
  siteProfile__vocabulary_version:
    name: siteProfile__vocabulary_version
    description: The site's Athena release, from its VOCABULARY table.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:vocabulary_version
    alias: vocabulary_version
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
    required: true
  siteProfile__cdm_schema:
    name: siteProfile__cdm_schema
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:cdm_schema
    alias: cdm_schema
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
    required: true
  siteProfile__vocab_schema:
    name: siteProfile__vocab_schema
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:vocab_schema
    alias: vocab_schema
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
    required: true
  siteProfile__source_value_fallback:
    name: siteProfile__source_value_fallback
    description: Also match raw ICD-10-CM strings in *_source_value. Default true.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:source_value_fallback
    alias: source_value_fallback
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: boolean
  siteProfile__personal_history_concepts:
    name: siteProfile__personal_history_concepts
    description: 'Concepts that mark an OBSERVATION row as the patient''s own history,
      with the condition in value_as_concept_id. Default: SNOMED CT 417662000 History
      of clinical finding in subject. Family-history concepts are deliberately not
      listed, so family history never matches.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:personal_history_concepts
    alias: personal_history_concepts
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: HistoryConcept
    multivalued: true
    inlined: true
    inlined_as_list: true
  siteProfile__updated:
    name: siteProfile__updated
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:updated
    alias: updated
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: date
    required: true
  siteProfile__change_note:
    name: siteProfile__change_note
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slot_uri: rapidcp:change_note
    alias: change_note
    owner: SiteProfile
    domain_of:
    - SiteProfile
    range: string
classes:
  ComputablePhenotype:
    name: ComputablePhenotype
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ComputablePhenotype
    description: One versioned CP. File name must equal cp_id + ".yaml".
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - computablePhenotype__cp_id
    - computablePhenotype__schema_version
    - computablePhenotype__title
    - computablePhenotype__disease
    - computablePhenotype__level
    - computablePhenotype__search_mode
    - computablePhenotype__cluster
    - computablePhenotype__status
    - computablePhenotype__provenance
    - computablePhenotype__review
    - computablePhenotype__sites_tested
    - computablePhenotype__expected_flag_rate
    - computablePhenotype__features
    - computablePhenotype__disjuncts
    - computablePhenotype__rules
    - computablePhenotype__score
    - computablePhenotype__absorbed_into
    - computablePhenotype__notes
    attributes:
      cp_id:
        name: cp_id
        description: <disease-id>_<level>_v<major>.<minor>, disease-id = lowercase
          Mondo id + '-' + disease.slug, e.g. mondo0010619-xlh_L1_v1.0
        identifier: true
        required: true
        pattern: ^mondo[0-9]{7}-[a-z0-9]+(-[a-z0-9]+)*_(L1|L2A|L2B|L3)_v[0-9]+\.[0-9]+$
      schema_version:
        name: schema_version
        description: Version of THIS schema the file conforms to, e.g. 0.1.0
        required: true
      title:
        name: title
        required: true
      disease:
        name: disease
        range: DiseaseRef
        required: true
        inlined: true
      level:
        name: level
        range: CPLevel
        required: true
      search_mode:
        name: search_mode
        range: SearchMode
        required: true
      cluster:
        name: cluster
        description: Required iff search_mode = cluster.
        range: ClusterScope
        inlined: true
      status:
        name: status
        range: CPStatus
        required: true
      provenance:
        name: provenance
        range: CPProvenance
        required: true
        inlined: true
      review:
        name: review
        description: Clinical sign-off. Recorded only; not enforced.
        range: ClinicalReview
        inlined: true
      sites_tested:
        name: sites_tested
        description: Where this CP version has been run, and with which build. Recorded
          only.
        range: SiteTest
        multivalued: true
        inlined_as_list: true
      expected_flag_rate:
        name: expected_flag_rate
        range: ExpectedFlagRate
        inlined: true
      features:
        name: features
        description: Atomic evidence items. Logic blocks reference them by id.
        range: Feature
        required: true
        multivalued: true
        inlined_as_list: true
      disjuncts:
        name: disjuncts
        description: Level 1 only.
        range: Disjunct
        multivalued: true
        inlined_as_list: true
      rules:
        name: rules
        description: Level 2a only. CP fires if ANY rule fires.
        range: Rule
        multivalued: true
        inlined_as_list: true
      score:
        name: score
        description: Level 2b only.
        range: ScoreModel
        inlined: true
      absorbed_into:
        name: absorbed_into
        description: The cluster CP that currently handles this disease, e.g. cluster-icd10n18x_L2A_v1.0.
          Empty once the disease stands alone. Cluster CPs themselves are not supported
          yet; the field and the cluster- naming are reserved so nothing needs renaming
          later.
        pattern: ^cluster-[a-z0-9]+_(L1|L2A|L2B|L3)_v[0-9]+\.[0-9]+$
      notes:
        name: notes
    class_uri: rapidcp:ComputablePhenotype
    tree_root: true
  DiseaseRef:
    name: DiseaseRef
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/DiseaseRef
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - diseaseRef__mondo_id
    - diseaseRef__slug
    - diseaseRef__name
    - diseaseRef__included_mondo_ids
    - diseaseRef__curation_record_version
    attributes:
      mondo_id:
        name: mondo_id
        range: uriorcurie
        required: true
        pattern: ^MONDO:[0-9]{7}$
      slug:
        name: slug
        description: Short lowercase hyphenated disease name used in file names, e.g.
          xlh, fabry.
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      name:
        name: name
        description: Human-readable disease name, for reviewers. Not queried.
        required: true
      included_mondo_ids:
        name: included_mondo_ids
        description: Every Mondo id that constitutes this disease entity, mondo_id
          included. One flat list on every CP, so the dashboard can find a disease's
          CPs with a single filter. Defaults to [mondo_id]. Recorded, not queried.
        range: uriorcurie
        multivalued: true
        pattern: ^MONDO:[0-9]{7}$
      curation_record_version:
        name: curation_record_version
        description: Version of the curation record (keyed by mondo_id) this CP was
          built from. Recorded, not queried.
    class_uri: rapidcp:DiseaseRef
  ClusterScope:
    name: ClusterScope
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ClusterScope
    description: Cluster-filtered search. The universe is persons with any of these
      umbrella codes (searched like a diagnostic_code feature); every criterion is
      then restricted to that universe.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - clusterScope__umbrella_codes
    - clusterScope__candidate_mondo_ids
    attributes:
      umbrella_codes:
        name: umbrella_codes
        range: CodeRef
        required: true
        multivalued: true
        inlined_as_list: true
      candidate_mondo_ids:
        name: candidate_mondo_ids
        description: 'Documentation only: the diseases under the umbrella. Not queried;
          each candidate gets its own CP.'
        range: uriorcurie
        multivalued: true
    class_uri: rapidcp:ClusterScope
  CPProvenance:
    name: CPProvenance
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CPProvenance
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - cPProvenance__authored_by
    - cPProvenance__authored_date
    - cPProvenance__kg_extracted_at
    - cPProvenance__change_note
    - cPProvenance__supersedes
    attributes:
      authored_by:
        name: authored_by
        required: true
      authored_date:
        name: authored_date
        range: date
        required: true
      kg_extracted_at:
        name: kg_extracted_at
        description: When the MendelGraph subgraph the features were drawn from was
          extracted (ISO 8601, e.g. 2026-09-24T14:05:00Z).
        range: datetime
      change_note:
        name: change_note
        description: Why this version exists (PR description summary).
      supersedes:
        name: supersedes
        description: Previous cp_id, if any.
    class_uri: rapidcp:CPProvenance
  HistoryConcept:
    name: HistoryConcept
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/HistoryConcept
    description: Either a SNOMED CT code (vocabulary + code), looked up at the site
      with its descendants unless include_descendants is false, or a raw OMOP concept_id
      used as is, e.g. a site-local concept.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - historyConcept__vocabulary
    - historyConcept__code
    - historyConcept__concept_id
    - historyConcept__label
    - historyConcept__include_descendants
    attributes:
      vocabulary:
        name: vocabulary
        description: SNOMED (the only vocabulary allowed here).
      code:
        name: code
      concept_id:
        name: concept_id
        range: integer
      label:
        name: label
      include_descendants:
        name: include_descendants
        description: Codes only. Default true.
        range: boolean
    class_uri: rapidcp:HistoryConcept
  SiteTest:
    name: SiteTest
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/SiteTest
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - siteTest__site
    - siteTest__site_version
    - siteTest__build
    attributes:
      site:
        name: site
        description: Lowercase site name, e.g. unc, truveta, dartnet.
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      site_version:
        name: site_version
        description: Version of the site file the run used.
        range: integer
        required: true
        minimum_value: 1
      build:
        name: build
        description: build_id of the build that ran there; must be a build of this
          CP.
        required: true
    class_uri: rapidcp:SiteTest
  ClinicalReview:
    name: ClinicalReview
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ClinicalReview
    description: Expert sign-off on the disease and its criteria, before the CP is
      tested at a site.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - clinicalReview__reviewer
    - clinicalReview__date
    - clinicalReview__decision
    - clinicalReview__comments
    attributes:
      reviewer:
        name: reviewer
        required: true
      date:
        name: date
        range: date
        required: true
      decision:
        name: decision
        range: ReviewDecision
        required: true
      comments:
        name: comments
    class_uri: rapidcp:ClinicalReview
  ExpectedFlagRate:
    name: ExpectedFlagRate
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ExpectedFlagRate
    description: Range of patients per 100,000 a correct CP should flag at a site
      (prevalence x ascertainment), from the Expected Flag Rate Pipeline. A wide range,
      not a target; feeds the flag-rate gauge.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - expectedFlagRate__low_per_100k
    - expectedFlagRate__high_per_100k
    - expectedFlagRate__basis
    - expectedFlagRate__source
    attributes:
      low_per_100k:
        name: low_per_100k
        description: May be omitted for an open-ended range.
        range: float
        minimum_value: 0
      high_per_100k:
        name: high_per_100k
        description: Required unless basis is none.
        range: float
        minimum_value: 0
      basis:
        name: basis
        range: FlagRateBasis
        required: true
      source:
        name: source
        description: Which pipeline run or reference produced the range.
        required: true
    class_uri: rapidcp:ExpectedFlagRate
  Feature:
    name: Feature
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Feature
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - feature__id
    - feature__module
    - feature__name
    - feature__specificity_tier
    - feature__hpo_id
    - feature__codes
    - feature__result
    - feature__genetic
    - feature__include_personal_history
    - feature__text_terms
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^f[0-9]+$
      module:
        name: module
        range: Module
        required: true
      name:
        name: name
        required: true
      specificity_tier:
        name: specificity_tier
        description: Specificity tier (1 = confirmatory/pathognomonic ... 5 = incidental).
          L1 disjuncts may only use tier 1.
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 5
      hpo_id:
        name: hpo_id
        description: 'Phenotype features: the HPO term this realises (annotation only,
          not queried).'
        range: uriorcurie
      codes:
        name: codes
        range: CodeRef
        required: true
        multivalued: true
        inlined_as_list: true
      result:
        name: result
        description: Required for diagnostic_test and for LOINC-coded phenotype.
        range: ResultCriterion
        inlined: true
      genetic:
        name: genetic
        description: Required for genetic_finding.
        range: GeneticCriterion
        inlined: true
      include_personal_history:
        name: include_personal_history
        description: 'diagnostic_code and coded phenotype features only. Default true:
          also count OBSERVATION rows recording the patient''s own history of the
          condition. Set false to count only direct records.'
        range: boolean
      text_terms:
        name: text_terms
        description: Names and synonyms for what the feature describes (a disease,
          a finding, a test or a drug), for a future text-search (NLP) step. Carried,
          never used by the OMOP generator.
        multivalued: true
    class_uri: rapidcp:Feature
  CodeRef:
    name: CodeRef
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CodeRef
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - codeRef__vocabulary
    - codeRef__code
    - codeRef__label
    - codeRef__include_descendants
    attributes:
      vocabulary:
        name: vocabulary
        range: CodeSystem
        required: true
      code:
        name: code
        required: true
      label:
        name: label
      include_descendants:
        name: include_descendants
        description: Default true for a feature's main codes, false for result value
          and unit codes. SNOMED/LOINC/RxNorm expand via CONCEPT_ANCESTOR; ICD10CM
          expands by code prefix.
        range: boolean
    class_uri: rapidcp:CodeRef
  ResultCriterion:
    name: ResultCriterion
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ResultCriterion
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - resultCriterion__kind
    - resultCriterion__operator
    - resultCriterion__value
    - resultCriterion__value_high
    - resultCriterion__units
    - resultCriterion__value_concepts
    attributes:
      kind:
        name: kind
        range: ResultKind
        required: true
      operator:
        name: operator
        description: numeric only
        range: ResultOperator
      value:
        name: value
        range: float
      value_high:
        name: value_high
        description: between only
        range: float
      units:
        name: units
        description: UCUM units the threshold applies to. Strongly recommended for
          numeric.
        range: CodeRef
        multivalued: true
        inlined_as_list: true
      value_concepts:
        name: value_concepts
        description: 'qualitative only: accepted answers (e.g. LOINC LA6576-8 Positive).'
        range: CodeRef
        multivalued: true
        inlined_as_list: true
    class_uri: rapidcp:ResultCriterion
  GeneticCriterion:
    name: GeneticCriterion
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/GeneticCriterion
    description: A row qualifies if its concept is in the feature's codes AND (when
      given) its value_as_concept_id is an accepted interpretation AND (when require_gene_text_match)
      the gene symbol appears in the row's source text.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - geneticCriterion__gene_symbol
    - geneticCriterion__hgnc_id
    - geneticCriterion__interpretations
    - geneticCriterion__require_gene_text_match
    attributes:
      gene_symbol:
        name: gene_symbol
        required: true
      hgnc_id:
        name: hgnc_id
        pattern: ^HGNC:[0-9]+$
      interpretations:
        name: interpretations
        range: CodeRef
        multivalued: true
        inlined_as_list: true
      require_gene_text_match:
        name: require_gene_text_match
        description: Default true when codes are generic LOINC panels.
        range: boolean
    class_uri: rapidcp:GeneticCriterion
  Disjunct:
    name: Disjunct
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Disjunct
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - disjunct__id
    - disjunct__feature
    - disjunct__min_distinct_dates
    - disjunct__min_span_days
    - disjunct__label
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^d[0-9]+$
      feature:
        name: feature
        required: true
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
      label:
        name: label
    class_uri: rapidcp:Disjunct
  Rule:
    name: Rule
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Rule
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - rule__id
    - rule__label
    - rule__expr
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^r[0-9]+$
      label:
        name: label
      expr:
        name: expr
        range: Expr
        required: true
        inlined: true
    class_uri: rapidcp:Rule
  Expr:
    name: Expr
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Expr
    description: 'Exactly one of: feature | all_of | any_of | none_of | at_least+of
      | within. none_of = NOT(any of). A rule must contain at least one positive feature.
      min_distinct_dates / min_span_days apply to a feature leaf.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - expr__feature
    - expr__min_distinct_dates
    - expr__min_span_days
    - expr__all_of
    - expr__any_of
    - expr__none_of
    - expr__at_least
    - expr__of
    - expr__within
    attributes:
      feature:
        name: feature
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
      all_of:
        name: all_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      any_of:
        name: any_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      none_of:
        name: none_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      at_least:
        name: at_least
        range: integer
        minimum_value: 1
      of:
        name: of
        range: Expr
        multivalued: true
        inlined_as_list: true
      within:
        name: within
        range: Within
        inlined: true
    class_uri: rapidcp:Expr
  Within:
    name: Within
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Within
    description: A record of each listed feature, all falling within `days` of each
      other. With in_order, the records must also occur in the listed order (the same
      day counts as in order).
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - within__days
    - within__in_order
    - within__of
    attributes:
      days:
        name: days
        range: integer
        required: true
        minimum_value: 0
      in_order:
        name: in_order
        range: boolean
      of:
        name: of
        description: Feature ids, at least two.
        required: true
        multivalued: true
    class_uri: rapidcp:Within
  ScoreModel:
    name: ScoreModel
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ScoreModel
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - scoreModel__threshold
    - scoreModel__items
    attributes:
      threshold:
        name: threshold
        range: float
        required: true
      items:
        name: items
        range: ScoreItem
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: rapidcp:ScoreModel
  ScoreItem:
    name: ScoreItem
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ScoreItem
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - scoreItem__id
    - scoreItem__feature
    - scoreItem__points
    - scoreItem__min_distinct_dates
    - scoreItem__min_span_days
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^s[0-9]+$
      feature:
        name: feature
        required: true
      points:
        name: points
        description: May be negative.
        range: float
        required: true
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
    class_uri: rapidcp:ScoreItem
  CPBuild:
    name: CPBuild
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CPBuild
    description: 'Header of a build SQL file (<build_id>.sql): the YAML between "--
      cpsql-build" and "-- end-cpsql-build", with the "-- " prefixes removed. Only
      CP-dependent fields; site settings are in site files.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - cPBuild__generator
    - cPBuild__cp_logic_sha256
    - cPBuild__build_id
    - cPBuild__cp_id
    - cPBuild__datamodel
    - cPBuild__build
    - cPBuild__change_note
    attributes:
      generator:
        name: generator
        description: cpsql version that wrote the SQL, e.g. 'cpsql 0.1.0'.
      cp_logic_sha256:
        name: cp_logic_sha256
        description: sha256 of the CP's logic (disease ids, level, search_mode, cluster,
          features, disjuncts, rules, score) the SQL was generated from. Lifecycle
          and documentation fields are excluded, so editing them doesn't invalidate
          a build.
      build_id:
        name: build_id
        description: <cp_id>_<datamodel>.b<build>, e.g. mondo0010619-xlh_L1_v1.0_omop54.b1
        identifier: true
        required: true
        pattern: ^.+_v[0-9]+\.[0-9]+_[a-z0-9]+\.b[0-9]+$
      cp_id:
        name: cp_id
        required: true
      datamodel:
        name: datamodel
        range: DataModel
        required: true
      build:
        name: build
        range: integer
        required: true
        minimum_value: 1
      change_note:
        name: change_note
    class_uri: rapidcp:CPBuild
  SiteProfile:
    name: SiteProfile
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/SiteProfile
    description: 'Site file, sites/<site>_v<version>.yaml: everything about running
      builds at one site. Applied at run time by `cpsql render --site`, so one build
      serves every site on a data model. Any change is a new version (new file); old
      versions are kept so past runs can be reproduced.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - siteProfile__site
    - siteProfile__version
    - siteProfile__datamodel
    - siteProfile__cdm_version
    - siteProfile__dialect
    - siteProfile__vocabulary_version
    - siteProfile__cdm_schema
    - siteProfile__vocab_schema
    - siteProfile__source_value_fallback
    - siteProfile__personal_history_concepts
    - siteProfile__updated
    - siteProfile__change_note
    attributes:
      site:
        name: site
        description: Lowercase site name, e.g. unc.
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      version:
        name: version
        range: integer
        required: true
        minimum_value: 1
      datamodel:
        name: datamodel
        range: DataModel
        required: true
      cdm_version:
        name: cdm_version
      dialect:
        name: dialect
        range: SqlDialect
      vocabulary_version:
        name: vocabulary_version
        description: The site's Athena release, from its VOCABULARY table.
        required: true
      cdm_schema:
        name: cdm_schema
        required: true
      vocab_schema:
        name: vocab_schema
        required: true
      source_value_fallback:
        name: source_value_fallback
        description: Also match raw ICD-10-CM strings in *_source_value. Default true.
        range: boolean
      personal_history_concepts:
        name: personal_history_concepts
        description: 'Concepts that mark an OBSERVATION row as the patient''s own
          history, with the condition in value_as_concept_id. Default: SNOMED CT 417662000
          History of clinical finding in subject. Family-history concepts are deliberately
          not listed, so family history never matches.'
        range: HistoryConcept
        multivalued: true
        inlined_as_list: true
      updated:
        name: updated
        range: date
        required: true
      change_note:
        name: change_note
    class_uri: rapidcp:SiteProfile
