classes:
  ComputablePhenotype:
    name: ComputablePhenotype
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ComputablePhenotype
    description: One versioned CP. File name must equal `cp_id` + `.yaml`.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - computablePhenotype__cp_id
    - computablePhenotype__schema_version
    - computablePhenotype__title
    - computablePhenotype__disease
    - computablePhenotype__level
    - computablePhenotype__search_mode
    - computablePhenotype__cluster
    - computablePhenotype__provenance
    - computablePhenotype__review
    - computablePhenotype__expected_flag_rate
    - computablePhenotype__features
    - computablePhenotype__disjuncts
    - computablePhenotype__rules
    - computablePhenotype__score
    - computablePhenotype__absorbed_into
    - computablePhenotype__notes
    attributes:
      cp_id:
        name: cp_id
        description: 'Name of the CP version, built from the disease, level and version.
          Format: `<disease-id>_<level>_v<major>.<minor>`, where `<disease-id>` is
          the lowercase Mondo id + ''-'' + disease.slug, e.g. `mondo0010619-xlh_L1_v1.0`'
        identifier: true
        required: true
        pattern: ^mondo[0-9]{7}-[a-z0-9]+(-[a-z0-9]+)*_(L1|L2A|L2B|L3)_v[0-9]+\.[0-9]+$
      schema_version:
        name: schema_version
        description: Version of THIS schema the file conforms to, e.g. `0.2.0`
        required: true
      title:
        name: title
        required: true
      disease:
        name: disease
        range: DiseaseRef
        required: true
        inlined: true
      level:
        name: level
        range: CPLevel
        required: true
      search_mode:
        name: search_mode
        range: SearchMode
        required: true
      cluster:
        name: cluster
        description: Required if and only if `search_mode` is `cluster`.
        range: ClusterScope
        inlined: true
      provenance:
        name: provenance
        range: CPProvenance
        required: true
        inlined: true
      review:
        name: review
        description: Clinical sign-off. Recorded only; not enforced.
        range: ClinicalReview
        inlined: true
      expected_flag_rate:
        name: expected_flag_rate
        range: ExpectedFlagRate
        inlined: true
      features:
        name: features
        description: Atomic evidence items. Logic blocks reference them by id.
        range: Feature
        required: true
        multivalued: true
        inlined_as_list: true
      disjuncts:
        name: disjuncts
        description: Level 1 only.
        range: Disjunct
        multivalued: true
        inlined_as_list: true
      rules:
        name: rules
        description: Level 2a only. CP fires if ANY rule fires.
        range: Rule
        multivalued: true
        inlined_as_list: true
      score:
        name: score
        description: Level 2b only.
        range: ScoreModel
        inlined: true
      absorbed_into:
        name: absorbed_into
        description: The cluster CP that currently handles this disease, e.g. `cluster-icd10n18x_L2A_v1.0`.
          Empty once the disease stands alone. Cluster CPs themselves are not supported
          yet; the field and the `cluster-` naming are reserved so nothing needs renaming
          later.
        pattern: ^cluster-[a-z0-9]+_(L1|L2A|L2B|L3)_v[0-9]+\.[0-9]+$
      notes:
        name: notes
    class_uri: rapidcp:ComputablePhenotype
    tree_root: true
  DiseaseRef:
    name: DiseaseRef
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/DiseaseRef
    description: The disease a CP is for, identified by an anchor Mondo id.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - diseaseRef__mondo_id
    - diseaseRef__slug
    - diseaseRef__name
    - diseaseRef__included_mondo_ids
    - diseaseRef__curation_record_version
    attributes:
      mondo_id:
        name: mondo_id
        range: uriorcurie
        required: true
        pattern: ^MONDO:[0-9]{7}$
      slug:
        name: slug
        description: Short lowercase hyphenated disease name used in file names, e.g.
          `xlh`, `fabry`.
        required: true
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      name:
        name: name
        description: Human-readable disease name, for reviewers. Not queried.
        required: true
      included_mondo_ids:
        name: included_mondo_ids
        description: Every Mondo id that constitutes this disease entity, `mondo_id`
          included. Defaults to `[mondo_id]`. Recorded, not queried.
        range: uriorcurie
        multivalued: true
        pattern: ^MONDO:[0-9]{7}$
      curation_record_version:
        name: curation_record_version
        description: Version of the curation record (keyed by `mondo_id`) this CP
          was built from. Recorded, not queried.
    class_uri: rapidcp:DiseaseRef
  ClusterScope:
    name: ClusterScope
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ClusterScope
    description: Limits the search to patients who have at least one of the umbrella
      codes. Every criterion is then evaluated only for those patients.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - clusterScope__umbrella_codes
    - clusterScope__candidate_mondo_ids
    attributes:
      umbrella_codes:
        name: umbrella_codes
        range: CodeRef
        required: true
        multivalued: true
        inlined_as_list: true
      candidate_mondo_ids:
        name: candidate_mondo_ids
        description: 'Documentation only: the diseases under the umbrella. Not queried;
          each candidate gets its own CP.'
        range: uriorcurie
        multivalued: true
    class_uri: rapidcp:ClusterScope
  CPProvenance:
    name: CPProvenance
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CPProvenance
    description: Who wrote this CP version and when.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - cPProvenance__authored_by
    - cPProvenance__authored_date
    - cPProvenance__kg_extracted_at
    - cPProvenance__change_note
    - cPProvenance__supersedes
    attributes:
      authored_by:
        name: authored_by
        required: true
      authored_date:
        name: authored_date
        range: date
        required: true
      kg_extracted_at:
        name: kg_extracted_at
        description: When Mendelian extracted the source data behind the features
          (ISO 8601, e.g. `2026-09-24T14:05:00Z`).
        range: datetime
      change_note:
        name: change_note
        description: Why this version exists (PR description summary).
      supersedes:
        name: supersedes
        description: Previous `cp_id`, if any.
    class_uri: rapidcp:CPProvenance
  ClinicalReview:
    name: ClinicalReview
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ClinicalReview
    description: Expert sign-off on the disease and its criteria, before the CP is
      tested at a site.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - clinicalReview__reviewer
    - clinicalReview__date
    - clinicalReview__decision
    - clinicalReview__comments
    attributes:
      reviewer:
        name: reviewer
        required: true
      date:
        name: date
        range: date
        required: true
      decision:
        name: decision
        range: ReviewDecision
        required: true
      comments:
        name: comments
    class_uri: rapidcp:ClinicalReview
  ExpectedFlagRate:
    name: ExpectedFlagRate
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ExpectedFlagRate
    description: Range of patients per 100,000 a correct CP should flag at a site.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - expectedFlagRate__low_per_100k
    - expectedFlagRate__high_per_100k
    - expectedFlagRate__basis
    - expectedFlagRate__source
    attributes:
      low_per_100k:
        name: low_per_100k
        description: May be omitted for an open-ended range.
        range: float
        minimum_value: 0
      high_per_100k:
        name: high_per_100k
        description: Required unless `basis` is `none`.
        range: float
        minimum_value: 0
      basis:
        name: basis
        range: FlagRateBasis
        required: true
      source:
        name: source
        description: Which pipeline run or reference produced the range.
        required: true
    class_uri: rapidcp:ExpectedFlagRate
  Feature:
    name: Feature
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Feature
    description: 'One piece of evidence: a set of codes for one module, plus the result
      or genetic finding that must be found where the module needs one. Logic blocks
      refer to features by id.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - feature__id
    - feature__module
    - feature__name
    - feature__specificity_grade
    - feature__hpo_id
    - feature__codes
    - feature__result
    - feature__genetic
    - feature__include_personal_history
    - feature__text_terms
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^f[0-9]+$
      module:
        name: module
        range: Module
        required: true
      name:
        name: name
        required: true
      specificity_grade:
        name: specificity_grade
        description: Specificity grade, written S1 to S5 in prose (1 = confirmatory/pathognomonic
          ... 5 = incidental). L1 disjuncts may only use S1 features.
        range: integer
        required: true
        minimum_value: 1
        maximum_value: 5
      hpo_id:
        name: hpo_id
        description: 'Phenotype features: the HPO term this realises (annotation only,
          not queried).'
        range: uriorcurie
      codes:
        name: codes
        range: CodeRef
        required: true
        multivalued: true
        inlined_as_list: true
      result:
        name: result
        description: Required for `diagnostic_test` features and for LOINC-coded `phenotype`
          features.
        range: ResultCriterion
        inlined: true
      genetic:
        name: genetic
        description: Required for `genetic_finding` features.
        range: GeneticCriterion
        inlined: true
      include_personal_history:
        name: include_personal_history
        description: '`diagnostic_code` and coded `phenotype` features only. Default
          `true`: also count `observation` rows recording the patient''s own history
          of the condition. Set `false` to count only direct records.'
        range: boolean
      text_terms:
        name: text_terms
        description: Names and synonyms for what the feature describes (a disease,
          a finding, a test or a drug), for a future text-search (NLP) step.
        multivalued: true
    class_uri: rapidcp:Feature
  CodeRef:
    name: CodeRef
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/CodeRef
    description: A code written as it appears in its source vocabulary, never as an
      OMOP `concept_id`.
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - codeRef__vocabulary
    - codeRef__code
    - codeRef__label
    - codeRef__include_descendants
    attributes:
      vocabulary:
        name: vocabulary
        range: CodeSystem
        required: true
      code:
        name: code
        required: true
      label:
        name: label
      include_descendants:
        name: include_descendants
        description: Default `true` for a feature's main codes, `false` for result
          value and unit codes. SNOMED/LOINC/RxNorm expand via `CONCEPT_ANCESTOR`;
          ICD10CM expands by code prefix.
        range: boolean
    class_uri: rapidcp:CodeRef
  ResultCriterion:
    name: ResultCriterion
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ResultCriterion
    description: 'The result a test or measurement record must have to count: a numeric
      comparison or a set of accepted answers.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - resultCriterion__kind
    - resultCriterion__operator
    - resultCriterion__value
    - resultCriterion__value_high
    - resultCriterion__units
    - resultCriterion__value_concepts
    attributes:
      kind:
        name: kind
        range: ResultKind
        required: true
      operator:
        name: operator
        description: '`numeric` only'
        range: ResultOperator
      value:
        name: value
        range: float
      value_high:
        name: value_high
        description: '`between` only'
        range: float
      units:
        name: units
        description: UCUM units the threshold applies to. Strongly recommended for
          `numeric`.
        range: CodeRef
        multivalued: true
        inlined_as_list: true
      value_concepts:
        name: value_concepts
        description: '`qualitative` only: accepted answers (e.g. LOINC `LA6576-8`
          Positive).'
        range: CodeRef
        multivalued: true
        inlined_as_list: true
    class_uri: rapidcp:ResultCriterion
  GeneticCriterion:
    name: GeneticCriterion
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/GeneticCriterion
    description: 'The variant result a `genetic_finding` feature looks for: a causal
      gene and the interpretations that count, such as pathogenic or likely pathogenic.
      A record matches when it carries one of the feature''s codes, its interpretation
      is one of those listed (if any are), and, when `require_gene_text_match` is
      `true`, the gene symbol appears in the record''s text.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - geneticCriterion__gene_symbol
    - geneticCriterion__hgnc_id
    - geneticCriterion__interpretations
    - geneticCriterion__require_gene_text_match
    attributes:
      gene_symbol:
        name: gene_symbol
        required: true
      hgnc_id:
        name: hgnc_id
        pattern: ^HGNC:[0-9]+$
      interpretations:
        name: interpretations
        range: CodeRef
        multivalued: true
        inlined_as_list: true
      require_gene_text_match:
        name: require_gene_text_match
        description: Default `true` when codes are generic LOINC panels.
        range: boolean
    class_uri: rapidcp:GeneticCriterion
  Disjunct:
    name: Disjunct
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Disjunct
    description: 'A Level 1 criterion: one S1 feature that is enough on its own to
      flag a patient. Its id is reported with the counts.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - disjunct__id
    - disjunct__feature
    - disjunct__min_distinct_dates
    - disjunct__min_span_days
    - disjunct__label
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^d[0-9]+$
      feature:
        name: feature
        required: true
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
      label:
        name: label
    class_uri: rapidcp:Disjunct
  Rule:
    name: Rule
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Rule
    description: 'A Level 2A criterion: a Boolean condition over features. A patient
      is flagged if any rule holds; each rule''s id is reported with the counts.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - rule__id
    - rule__label
    - rule__expr
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^r[0-9]+$
      label:
        name: label
      expr:
        name: expr
        range: Expr
        required: true
        inlined: true
    class_uri: rapidcp:Rule
  Expr:
    name: Expr
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Expr
    description: 'One condition in a Level 2A rule. Each node uses exactly one form:
      `feature`, `all_of`, `any_of`, `none_of` (none of the listed conditions holds),
      `at_least` with `of`, or `within`. A rule must contain at least one feature
      that isn''t under `none_of`. `min_distinct_dates` and `min_span_days` apply
      only to a `feature` node.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - expr__feature
    - expr__min_distinct_dates
    - expr__min_span_days
    - expr__all_of
    - expr__any_of
    - expr__none_of
    - expr__at_least
    - expr__of
    - expr__within
    attributes:
      feature:
        name: feature
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
      all_of:
        name: all_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      any_of:
        name: any_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      none_of:
        name: none_of
        range: Expr
        multivalued: true
        inlined_as_list: true
      at_least:
        name: at_least
        range: integer
        minimum_value: 1
      of:
        name: of
        range: Expr
        multivalued: true
        inlined_as_list: true
      within:
        name: within
        range: Within
        inlined: true
    class_uri: rapidcp:Expr
  Within:
    name: Within
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/Within
    description: A record of each listed feature, all falling within `days` of each
      other. With `in_order`, the records must also occur in the listed order (the
      same day counts as in order).
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - within__days
    - within__in_order
    - within__of
    attributes:
      days:
        name: days
        range: integer
        required: true
        minimum_value: 0
      in_order:
        name: in_order
        range: boolean
      of:
        name: of
        description: Feature ids, at least two.
        required: true
        multivalued: true
    class_uri: rapidcp:Within
  ScoreModel:
    name: ScoreModel
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ScoreModel
    description: 'The Level 2B logic: a patient is flagged when the points of the
      items that apply add up to the threshold.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - scoreModel__threshold
    - scoreModel__items
    attributes:
      threshold:
        name: threshold
        range: float
        required: true
      items:
        name: items
        range: ScoreItem
        required: true
        multivalued: true
        inlined_as_list: true
    class_uri: rapidcp:ScoreModel
  ScoreItem:
    name: ScoreItem
    definition_uri: https://mendelian.co/schemas/rapid-cp-logic/ScoreItem
    description: 'A Level 2B score item: points added when its feature is present.
      Its id is reported with the counts.'
    from_schema: https://mendelian.co/schemas/rapid-cp-logic
    slots:
    - scoreItem__id
    - scoreItem__feature
    - scoreItem__points
    - scoreItem__min_distinct_dates
    - scoreItem__min_span_days
    attributes:
      id:
        name: id
        identifier: true
        required: true
        pattern: ^s[0-9]+$
      feature:
        name: feature
        required: true
      points:
        name: points
        description: May be negative.
        range: float
        required: true
      min_distinct_dates:
        name: min_distinct_dates
        range: integer
        minimum_value: 1
      min_span_days:
        name: min_span_days
        description: Records must stretch across at least this many days, first to
          last.
        range: integer
        minimum_value: 1
    class_uri: rapidcp:ScoreItem
metamodel_version: 1.12.0
